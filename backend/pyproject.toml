[project]
name = "workshop-mcp"
version = "0.1.0"
description = "Consulta de dados por perfil com servidor MCP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
]
