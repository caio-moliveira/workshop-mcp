[project]
name = "workshop-mcp"
version = "0.1.0"
description = "Consulta de dados por perfil com servidor MCP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faker>=40.63.0",
    "fastapi>=0.165.0",
    "fastmcp==4.2.5",
    "httpx2>=2.16.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[anthropic,mcp]>=2.74.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
]
