# Tema de login do pulso. (FE §9). Herda os templates e scripts do tema `base` do Keycloak, que
# não traz estilo nenhum; a cara vem de template.ftl e resources/css/pulso.css. As classes abaixo
# são as que os templates do `base` aplicam em cada elemento.
parent=base

styles=css/pulso.css

kcHtmlClass=pulso
kcLoginClass=pulso-tela
kcFormCardClass=pulso-cartao
kcFormHeaderClass=pulso-cabecalho
kcFormGroupClass=pulso-campo
kcLabelClass=pulso-rotulo
kcInputClass=pulso-entrada
kcInputGroup=pulso-entrada-com-botao
kcInputErrorMessageClass=pulso-erro-do-campo
kcButtonClass=pulso-botao
kcButtonPrimaryClass=pulso-botao-principal
kcFormPasswordVisibilityButtonClass=pulso-mostrar-senha
kcFormPasswordVisibilityIconShow=pulso-icone-mostrar
kcFormPasswordVisibilityIconHide=pulso-icone-ocultar
kcAlertClass=pulso-aviso
kcAlertTitleClass=pulso-aviso-texto
