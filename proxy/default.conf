# Proxy reverso do ambiente: o provedor de identidade e o servidor MCP sob um único endereço, o
# que o túnel publica (V1). Só passam as rotas que um assistente externo usa; o resto é 404.

# Resolve os nomes dos serviços a cada pedido, pelo DNS do Docker, e não só ao subir: o keycloak e
# o mcp podem ser recriados com outro endereço sem o proxy ficar apontando para o antigo.
resolver 127.0.0.11 valid=10s ipv6=off;

# Atrás do túnel, o esquema e a porta públicos chegam nos cabeçalhos dele (https, 443); direto na
# máquina, valem os do próprio pedido, com a porta publicada que está no Host.
map $http_x_forwarded_proto $esquema_publico {
    "" $scheme;
    default $http_x_forwarded_proto;
}

map $http_host $porta_do_host {
    ~:(?<porta>\d+)$ $porta;
    default "";
}

map "$http_x_forwarded_port|$porta_do_host|$esquema_publico" $porta_publica {
    ~^(?<porta>\d+)\| $porta;
    ~^\|(?<porta>\d+)\| $porta;
    ~https$ 443;
    default 80;
}

server {
    listen 80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $esquema_publico;
    proxy_set_header X-Forwarded-Port $porta_publica;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    set $mcp http://mcp:8001;
    set $keycloak http://keycloak:8080;

    # Servidor MCP: o protocolo e os metadados de recurso protegido (RFC 9728).
    location = /mcp {
        proxy_pass $mcp;
        # Respostas em fluxo (SSE) passam como chegam.
        proxy_buffering off;
    }

    location /.well-known/oauth-protected-resource/ {
        proxy_pass $mcp;
    }

    # Provedor: o realm da aplicação (metadados, autorização, token, registro, chaves e login) e
    # os arquivos estáticos do tema. Só o realm pulso: o master, por onde se obtém o token de
    # administrador, não passa.
    location /realms/pulso/ {
        proxy_pass $keycloak;
    }

    location /resources/ {
        proxy_pass $keycloak;
    }

    # Metadados do servidor de autorização no caminho da raiz, com o realm inserido depois do
    # `.well-known` (RFC 8414 e o equivalente OpenID Connect): o Keycloak só os publica dentro do
    # realm, e alguns SDKs procuram primeiro aqui.
    location ~ ^/\.well-known/(?<formato>oauth-authorization-server|openid-configuration)/realms/pulso$ {
        proxy_pass $keycloak/realms/pulso/.well-known/$formato;
    }

    # Tudo o mais, inclusive o console de administração (/admin/), não existe por aqui.
    location / {
        return 404;
    }
}

# Só para o healthcheck do compose: uma porta que não é publicada, para a verificação não virar
# uma rota a mais no endereço público.
server {
    listen 8081;

    location = /saude {
        return 200;
    }
}
