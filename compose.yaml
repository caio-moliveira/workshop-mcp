# Sobe o ambiente inteiro, com o banco carregado do zero: docker compose up -d --build --wait
# Recarga, só do banco, com o resto no ar: docker compose run --rm --build carga (ADR 0001).
name: workshop-mcp

# Tempo de inatividade que encerra a sessão: a única fonte do valor. O provedor o usa no realm
# (ssoSessionIdleTimeout) e o frontend o recebe em /configuracao.json, para não renovar o token
# de quem parou de usar a aplicação. Para encurtar numa demonstração, defina a variável no shell,
# acima dos 5 minutos do token de acesso (a renovação é o que prorroga a sessão do provedor):
#   INATIVIDADE_DA_SESSAO_EM_SEGUNDOS=360 docker compose up -d --wait keycloak frontend
x-sessao: &sessao
  INATIVIDADE_DA_SESSAO_EM_SEGUNDOS: ${INATIVIDADE_DA_SESSAO_EM_SEGUNDOS:-1800}

services:
  postgres:
    image: postgres:18.1-alpine
    env_file: backend/.env
    ports:
      # Só a máquina local alcança o banco.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Roda uma vez e termina; sobe o Postgres antes, pela dependência. Também cria o banco, o papel
  # e a tabela da auditoria, se faltarem, sem nunca apagá-los (ADR 0008), e o mesmo para o banco
  # do histórico das conversas (ADR 0009); as senhas dos papéis, SENHA_DO_PAPEL_AUDITORIA e
  # SENHA_DO_PAPEL_HISTORICO, vêm do .env.
  carga:
    build:
      context: backend
      dockerfile: carga/Dockerfile
    env_file: backend/.env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Provedor de identidade. Sem estado persistente: a cada subida, importa o realm versionado
  # (ADR 0004). As senhas dos usuários de demonstração entram pelos placeholders do arquivo.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    # O emissor (iss) é sempre o endereço público, venha a requisição de onde vier.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - KC_HOSTNAME="$$ENDERECO_PUBLICO_DO_PROVEDOR" exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    env_file: backend/.env
    environment:
      <<: *sessao
      # Banco em memória: nada sobrevive a um reinício, nem o realm importado.
      KC_DB: dev-mem
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Atrás do proxy (e do túnel), o esquema e o host públicos chegam nos cabeçalhos
      # X-Forwarded-*: o canal interno (token, chaves) sai no endereço por onde o pedido chegou,
      # com https pelo túnel. O emissor continua fixo no endereço público. Direto em
      # localhost:8080, sem esses cabeçalhos, nada muda.
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Os metadados do realm, nos dois formatos (OpenID Connect e RFC 8414), saem sem
      # `scopes_supported`. Um cliente do protocolo MCP (o SDK do Inspector) acrescenta
      # `offline_access` ao pedido sempre que o provedor o anuncia, e os usuários não têm acesso
      # offline: o login pararia na troca do código. Sem o anúncio, o pedido sai só com o escopo
      # dos metadados do recurso protegido.
      KC_SPI_WELL_KNOWN__OPENID_CONFIGURATION__INCLUDE_CLIENT_SCOPES: "false"
      KC_SPI_WELL_KNOWN__OAUTH_AUTHORIZATION_SERVER__INCLUDE_CLIENT_SCOPES: "false"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # Tema de login do pulso. (FE §9), escolhido no realm. Em start-dev o Keycloak não guarda
      # temas em cache: uma mudança aparece ao recarregar a tela, sem reiniciar.
      - ./keycloak/temas/pulso:/opt/keycloak/themes/pulso:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # A imagem não tem curl: consulta a prontidão pela porta de gerenciamento.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 3s
      timeout: 3s
      retries: 60

  # API das telas. Valida o token: emissor público, chaves buscadas pela rede interna. Lê o banco
  # só pelo mecanismo de consultas, com o papel do perfil de quem pede. O assistente chama o
  # servidor MCP pela rede interna, com o token de quem pergunta; o modelo vem de
  # MODELO_DO_ASSISTENTE e a chave, da variável do provedor (ANTHROPIC_API_KEY), as duas do
  # .env. Sem a chave, a API sobe assim mesmo e só o assistente fica indisponível. Grava e lê as
  # conversas no banco do histórico com o papel `historico` (SENHA_DO_PAPEL_HISTORICO, do .env).
  # O interruptor de demonstração fica ligado: o ambiente local é o do workshop. Com ele, a rota
  # /seguranca devolve a última execução de aceite, gravada pelo comando em
  # backend/execucao-de-aceite/ (uv run python tests/execucao_de_aceite.py). O painel revela os
  # nomes das rotas e das ferramentas de todos os perfis: fora de uma demonstração, desligue.
  api:
    build:
      context: backend
      dockerfile: api/Dockerfile
    env_file: backend/.env
    environment:
      ENDERECO_INTERNO_DO_PROVEDOR: http://keycloak:8080
      ENDERECO_INTERNO_DO_MCP: http://mcp:8001/mcp
      POSTGRES_HOST: postgres
      PAINEL_DE_SEGURANCA: ligado
      PASTA_DA_EXECUCAO_DE_ACEITE: /execucao-de-aceite
    volumes:
      # Só leitura: quem grava é o comando da execução de aceite, na máquina local.
      - ./backend/execucao-de-aceite:/execucao-de-aceite:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      keycloak:
        condition: service_healthy
      # A API só sobe com o banco carregado: assim `up --wait` termina com tudo pronto.
      carga:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    healthcheck:
      # A consulta prévia do navegador vindo do frontend: responde 200 sem token nem provedor, e
      # não deixa no log uma recusa a cada verificação. A API não publica /docs.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          pedido = urllib.request.Request(
              "http://127.0.0.1:8000/eu",
              method="OPTIONS",
              headers={
                  "Origin": os.environ["ENDERECO_DO_FRONTEND"],
                  "Access-Control-Request-Method": "GET",
              },
          )
          urllib.request.urlopen(pedido, timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30

  # Servidor MCP: as mesmas consultas como ferramentas para agentes de IA, em /mcp, sem estado.
  # Importa o acesso e as consultas direto, sem passar pela API. Só aceita tokens cujo
  # destinatário inclui pulso-mcp (ADR 0006). Publica os metadados de recurso protegido em
  # /.well-known/oauth-protected-resource/mcp, com ENDERECO_PUBLICO_DO_MCP como recurso, e a
  # recusa sem token os aponta: é por eles que o MCP Inspector chega ao login do realm. Grava
  # cada chamada no banco da auditoria com o papel `auditoria` (SENHA_DO_PAPEL_AUDITORIA, do .env).
  mcp:
    build:
      context: backend
      dockerfile: servidor_mcp/Dockerfile
    env_file: backend/.env
    environment:
      ENDERECO_INTERNO_DO_PROVEDOR: http://keycloak:8080
      POSTGRES_HOST: postgres
      # Limite de frequência (RS-11): chamadas por usuário numa janela deslizante, em segundos.
      # Vem do shell, como as portas, e não do .env: a suíte de testes faz centenas de chamadas
      # com o mesmo usuário e precisa do servidor com um limite alto, sem mexer no .env da
      # demonstração. Para rodar a suíte:
      #   LIMITE_DE_CHAMADAS_POR_USUARIO=100000 docker compose up -d --wait mcp
      LIMITE_DE_CHAMADAS_POR_USUARIO: ${LIMITE_DE_CHAMADAS_POR_USUARIO:-30}
      JANELA_DO_LIMITE_EM_SEGUNDOS: ${JANELA_DO_LIMITE_EM_SEGUNDOS:-60}
    ports:
      # Só a máquina local alcança o servidor MCP.
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      keycloak:
        condition: service_healthy
      # Como a API, só sobe com o banco carregado.
      carga:
        condition: service_completed_successfully
    healthcheck:
      # Uma rota própria, fora do protocolo: responde 200 sem token, e não deixa no log uma
      # recusa a cada verificação.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8001/saude", timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30

  # Proxy reverso: o provedor de identidade e o servidor MCP sob um único endereço, o que o túnel
  # publica na V1. Sempre no ar, para o roteamento ser testável sem túnel nem internet. Só deixa
  # passar as rotas de que um assistente externo precisa (proxy/default.conf); o console de
  # administração e qualquer outro caminho respondem 404.
  proxy:
    image: nginx:1.30.7-alpine
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Só a máquina local alcança o proxy; de fora, só pelo túnel.
      - "127.0.0.1:${PROXY_PORT:-8088}:80"
    depends_on:
      keycloak:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      # Uma porta interna, não publicada: a verificação não vira rota no endereço público.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/saude"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Túnel rápido do cloudflared (*.trycloudflare.com, sem conta): publica o proxy na internet com
  # HTTPS, para o Claude e o ChatGPT alcançarem o ambiente local (V1). Só sobe quando pedido:
  #   docker compose --profile tunel up -d --wait
  # O endereço muda a cada execução, inclusive quando o compose recria o serviço, e aparece no
  # log (docker compose logs tunel); os passos para ligar o modo túnel estão em
  # backend/.env.example. Só alcança o proxy, pela rede interna: o banco e o console de
  # administração continuam fora do alcance.
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    depends_on:
      proxy:
        condition: service_healthy

  # Frontend: o build servido por nginx. Os endereços do provedor e da API entram ao subir o
  # contêiner, em /configuracao.json, sem rebuild. Abra em http://localhost:5173, o endereço que
  # o provedor aceita como retorno do login (ENDERECO_DO_FRONTEND).
  frontend:
    build:
      context: frontend
    env_file: backend/.env
    environment:
      <<: *sessao
      ENDERECO_DA_API: http://127.0.0.1:${API_PORT:-8000}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/configuracao.json"]
      interval: 2s
      timeout: 3s
      retries: 30
